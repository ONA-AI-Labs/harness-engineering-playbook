<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The maturity model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em;
      line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Harness Engineering Playbook</p>
    <h1>The maturity model</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="maturity-ladder-title maturity-ladder-desc">
        <title id="maturity-ladder-title">The maturity model</title>
        <desc id="maturity-ladder-desc">Five levels from an unharnessed repository to a governed one, each scored by the audit on enforcement rather than on file presence.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="136" y="40" width="760" height="64" fill="#f5f5f5"/>
<text x="156" y="78" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.18em">L4</text>
<text x="208" y="78" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="600">Governed</text>
<text x="876" y="78" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">owners on harness files · CI on pull requests · expiry on rules · a budget rule</text>
<rect x="136" y="104" width="760" height="64" fill="#ececec"/>
<text x="156" y="142" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.18em">L3</text>
<text x="208" y="142" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="600">Continuous</text>
<text x="876" y="142" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">docs in the repo · a debt gate in CI · enforced hard rules · evals or metrics</text>
<line x1="136" y1="104" x2="896" y2="104" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="136" y="168" width="760" height="64" fill="rgba(191,69,32,0.08)"/>
<rect x="136" y="168" width="760" height="64" fill="none" stroke="#bf4520" stroke-width="1.2"/>
<text x="156" y="206" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.18em">L2</text>
<text x="208" y="206" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="600">Enforced</text>
<text x="876" y="206" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">hooks · guard · stop-time check · allow list · done means verifying what ships</text>
<line x1="136" y1="168" x2="896" y2="168" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="136" y="232" width="760" height="64" fill="#ececec"/>
<text x="156" y="270" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.18em">L1</text>
<text x="208" y="270" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="600">Instructed</text>
<text x="876" y="270" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">a map under 100 lines that names a check that exists · a lockfile</text>
<line x1="136" y1="232" x2="896" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="136" y="296" width="760" height="64" fill="#f5f5f5"/>
<text x="156" y="334" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.18em">L0</text>
<text x="208" y="334" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="600">Unharnessed</text>
<text x="876" y="334" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="end">no instruction file, or one nobody maintains</text>
<line x1="136" y1="296" x2="896" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="136" y="40" width="760" height="320" fill="none" stroke="#2d3142" stroke-width="1"/>
<line x1="104" y1="352" x2="104" y2="48" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="96" y="380" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" font-weight="500" letter-spacing="0.14em">ENFORCEMENT</text>
<line x1="40" y1="400" x2="920" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="48" y="409" width="24" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
<text x="80" y="419" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">WHERE MOST TEAMS SHOULD BE IN A WEEK</text>
<rect x="315.20000000000005" y="409" width="24" height="14" rx="3" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
<text x="347.20000000000005" y="419" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em">SCORED BY TOOLS/AUDIT-HARNESS.PY</text>
      </svg>
    </div>
  </div>
</body>
</html>
